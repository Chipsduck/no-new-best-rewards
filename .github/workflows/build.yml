name: Build Geode Mod

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: win
          - name: macOS
            os: macos-latest
            target: mac
          - name: Android64
            os: ubuntu-latest
            target: android64
          - name: Android32
            os: ubuntu-latest
            target: android32

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}

  combine:
    name: Package builds
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.geode
          
