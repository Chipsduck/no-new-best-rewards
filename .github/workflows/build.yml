name: Build Geode Mod

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            generator: Ninja
          - name: Android64
            os: ubuntu-latest
            platform: android64
            generator: Ninja
          - name: Android32
            os: ubuntu-latest
            platform: android32
            generator: Ninja
          - name: macOS
            os: macos-latest
            platform: mac
            generator: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode
        uses: geode-sdk/setup@v1
        with:
          platform: ${{ matrix.platform }}

      - name: Build Mod
        run: geode build -p ${{ matrix.platform }} -- -G "${{ matrix.generator }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.platform }}
          path: build*/*.geode

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Geode
        uses: geode-sdk/setup@v1
        with:
          platform: android64

      - name: Merge .geode Packages
        run: |
          mkdir -p merged
          geode package merge artifacts/*/*.geode -o merged/chipsduck.no_newbest_rewards.geode

      - name: Upload Merged Package
        uses: actions/upload-artifact@v4
        with:
          name: chipsduck.no_newbest_rewards.geode
          path: merged/chipsduck.no_newbest_rewards.geode

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: merged/chipsduck.no_newbest_rewards.geode
          
